server:
  port: 8080

spring:
  application:
    name: vaccine-system
  profiles:
    active: dev
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null
  servlet:
    multipart:
      max-file-size: 10MB
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: "2"
    locations: classpath:db/migration
    encoding: UTF-8

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

knife4j:
  enable: true
  setting:
    language: zh_cn

jwt:
  secret: vaccine-system-jwt-secret-key-2026-spring-boot
  expiration: 86400000

vaccine:
  default-hospital-id: 1

logging:
  level:
    com.tjut.edu.vaccine: debug
    com.baomidou.mybatisplus: debug
